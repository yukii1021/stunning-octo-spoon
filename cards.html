html[data-gm="light"]{
  --bg:#f4f6fa; --bg2:#e9eef7;
  --panel:rgba(255,255,255,.94); --panel2:#fff; --panel3:#f6f8fc;
  --line:#dde2ec; --line2:#eef1f7;
  --txt:#141821; --dim:#4f5a6c; --dim2:#6d7788;
  --acc:#1f7ae0; --acc2:#5aa1ea; --accSoft:rgba(31,122,224,.1);
  --red:#d4453a; --blue:#1f7ae0; --green:#12996a; --purple:#7a5cc4; --gold:#c8961e;
  --hp:#d4453a; --hpE:#7a5cc4;
  --sh:0 6px 20px rgba(20,30,50,.1);
  --scr:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.9));
  --navbg:#ffffff;
  --bgimg:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
html{scroll-padding-top:70px}
body{background:var(--bg);color:var(--txt);font-family:var(--fs);font-size:14px;line-height:1.5;overflow-x:hidden;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch}
.bgfx{display:none}
html[data-gm="ice"] .bgfx,html[data-gm="huaxu"] .bgfx{
  display:block;position:fixed;inset:0;z-index:0;background-image:var(--bgimg);
  background-size:cover;background-position:50% 50%;background-repeat:no-repeat;
}
html[data-gm="ice"] .bgfx{background-position:42% 50%}
html[data-gm="huaxu"] .bgfx{background-position:45% 42%}
.bgfx::after{content:"";position:absolute;inset:0;background:var(--scr)}
html[data-gm="ice"] .bgfx::after{background:linear-gradient(180deg,rgba(5,9,17,.72) 0,rgba(5,9,17,.52) 34%,rgba(5,9,17,.66) 72%,rgba(5,9,17,.88) 100%)}
html[data-gm="huaxu"] .bgfx::after{background:linear-gradient(180deg,rgba(246,241,232,.58) 0,rgba(246,241,232,.34) 34%,rgba(246,241,232,.6) 72%,rgba(246,241,232,.9) 100%)}
#app{position:relative;z-index:1}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;margin:0;letter-spacing:.04em}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.num{font-family:var(--fn);font-variant-numeric:tabular-nums;letter-spacing:.03em}
/* ===================== shell ===================== */
#app{min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
  background:var(--navbg);
  border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.45);
}
.tb-title{font-family:var(--fd);font-size:14.5px;font-weight:600;letter-spacing:.05em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tb-title small{display:block;font-family:var(--fn);font-size:8px;letter-spacing:.18em;color:var(--dim2);font-weight:400;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.chip.coin{border-color:var(--acc);color:var(--acc)}
.chip.coin .num{font-size:14px}
.screen{display:none;padding:12px 13px 20px}
.screen.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:11px;box-shadow:var(--sh);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.tight{padding:10px}
.card h2{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:9px;letter-spacing:.08em}
.card h2::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--acc2),var(--acc));flex:none}
.card h2 .hint{margin-left:auto;font-family:var(--fs);font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:0}
.sub{font-size:11.5px;color:var(--dim);line-height:1.65}
.tip{font-size:10.5px;color:var(--dim);line-height:1.6;padding:2px 0}
html[data-gm="huaxu"] .tip{color:#7a6a54}
html[data-gm="light"] .tip{color:#5d6779}
.hr{height:1px;background:var(--line2);margin:10px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 15px;border-radius:14px;font-weight:600;font-size:14px;letter-spacing:.05em;background:var(--panel3);border:1px solid var(--line);color:var(--txt);transition:transform .12s;font-family:var(--fd)}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#20160a;border-color:transparent;box-shadow:0 6px 18px rgba(230,180,80,.24)}
html[data-gm="huaxu"] .btn.primary{color:#fff}
html[data-gm="light"] .btn.primary{color:#fff}
html[data-gm="ice"] .btn.primary{color:#0a1522}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.mt{margin-top:9px}
/* ===================== nav ===================== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;padding:0 0 env(safe-area-inset-bottom);background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav::before{content:"";position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.75}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;font-size:10px;color:var(--dim);position:relative;font-family:var(--fd);letter-spacing:.05em}
.nav button .ni{font-size:18px;line-height:1;filter:grayscale(1) opacity(.6)}
.nav button.active{color:var(--acc)}
.nav button.active .ni{filter:none}
.nav button.active::after{content:"";position:absolute;top:2px;width:30px;height:2.5px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
/* ===================== unit chip / cards ===================== */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.ucell{min-width:0}
.u{
  position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.24);
  background:linear-gradient(180deg,var(--pc1),var(--pc2));display:flex;flex-direction:column;
  aspect-ratio:60/92;touch-action:auto;transition:transform .18s cubic-bezier(.3,1.2,.5,1),box-shadow .18s;
}
.u::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.42))}
.u .r1{flex:none;height:12px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;font-size:6.5px;color:#fff;background:rgba(0,0,0,.34);position:relative;z-index:2}
.u .r1 .st{color:#ffe9a8;letter-spacing:-1px}
.u .art{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.u .glyph{position:relative;z-index:2;font-family:var(--fd);font-weight:600;color:rgba(255,255,255,.96);text-shadow:0 2px 7px rgba(0,0,0,.6);font-size:19px;line-height:1}
.u .hp{flex:none;height:5px;margin:0 3px;border-radius:3px;background:rgba(0,0,0,.55);overflow:hidden;border:1px solid rgba(255,255,255,.14);position:relative;z-index:2}
.u .hp i{display:block;height:100%;background:linear-gradient(90deg,#c9433a,#e8836f);transition:width .3s}
.u .r2{flex:none;height:13px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;font-size:7px;color:#fff;background:rgba(0,0,0,.44);position:relative;z-index:2}
.u .r2 .a{color:#ffc9c0}
.u .r2 .h{color:#b8e6c8}
.u .fxb{
  position:absolute;top:13px;left:2px;z-index:3;font-family:var(--fd);font-size:6.5px;line-height:1;
  padding:2px 3px;border-radius:4px;background:rgba(0,0,0,.62);color:#ffe9a8;
  border:1px solid rgba(255,233,168,.35);letter-spacing:.02em;max-width:calc(100% - 4px);
  overflow:hidden;white-space:nowrap;
}
.u.gold{border-color:#ffe9a8;box-shadow:0 0 0 1px rgba(255,233,168,.5),0 3px 12px rgba(230,180,80,.4)}
.u.dim{filter:grayscale(.55) brightness(.72)}
.u.dragging,.hcard.dragging{opacity:.3}
.u.sel{outline:2px solid var(--acc);outline-offset:2px}
.hcard{
  width:88px;height:126px;flex:none;position:relative;border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,var(--pc1),var(--pc2));border:1px solid rgba(255,255,255,.24);
  display:flex;flex-direction:column;touch-action:auto;box-shadow:0 4px 12px rgba(0,0,0,.32);
}
.hcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.4))}
.hcard .r1{flex:none;height:13px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:7.5px;color:#fff;background:rgba(0,0,0,.34);position:relative;z-index:2}
.hcard .r1 .st{color:#ffe9a8;letter-spacing:-1px}
.hcard .art{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.hcard .glyph{position:relative;z-index:2;font-family:var(--fd);font-weight:600;color:rgba(255,255,255,.96);text-shadow:0 2px 8px rgba(0,0,0,.65);font-size:29px;line-height:1}
.hcard .nm{flex:none;position:relative;z-index:2;font-family:var(--fd);font-weight:600;font-size:9.5px;line-height:1.12;text-align:center;color:#fff;background:rgba(0,0,0,.36);padding:2px 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard .fxb{flex:none;position:relative;z-index:2;font-size:9px;text-align:center;color:#ffe9a8;background:rgba(0,0,0,.52);padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.hcard .r2{flex:none;position:relative;z-index:2;display:flex;border-top:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.46);font-size:9.5px;color:#fff}
.hcard .r2 span{flex:1;text-align:center;padding:3px 0;font-weight:600}
.hcard .r2 .a{color:#ffc9c0;border-right:1px solid rgba(255,255,255,.16)}
.hcard .r2 .h{color:#b8e6c8}
.hcard.gold{border-color:#ffe9a8;box-shadow:0 0 0 1px rgba(255,233,168,.5),0 4px 16px rgba(230,180,80,.45)}
.hcard.gold::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.4) 48%,transparent 62%);animation:shim 3.4s linear infinite}
@keyframes shim{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.hcard.sel{outline:2px solid var(--acc);outline-offset:2px}
.hcard.treasure{background:linear-gradient(180deg,#7a5cc4,#2a1f45)}
.strip .hcard{touch-action:pan-x}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;min-height:132px;align-items:center}
.strip::-webkit-scrollbar{display:none}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lit{display:flex;flex-direction:column;min-width:0}
.lit .hcard{width:100%;height:128px}
.lit .pr{background:var(--panel3);color:var(--acc);border:1px solid var(--line);border-top:0;font-size:10.5px;text-align:center;padding:4px 2px;border-radius:0 0 11px 11px;font-weight:600}
.lit.sold .hcard{filter:grayscale(.8) brightness(.6)}
.slot{border-radius:10px;border:1.5px dashed var(--line);background:var(--line2);aspect-ratio:60/92;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--dim2);font-family:var(--fd)}
.empty-note{font-size:11px;color:var(--dim2);text-align:center;padding:14px 0;font-family:var(--fd)}
/* drop zones */
[data-dz]{transition:background .15s,box-shadow .15s,border-color .15s}
body.dragging [data-dz]{background:rgba(230,180,80,.05);box-shadow:inset 0 0 0 1px rgba(230,180,80,.35)}
[data-dz].hot{background:var(--accSoft)!important;box-shadow:inset 0 0 0 2px var(--acc)!important;border-color:var(--acc)!important}
.sellzone{border:1.5px dashed var(--line);border-radius:12px;padding:9px;text-align:center;font-size:11px;color:var(--dim);font-family:var(--fd)}
.dragghost{position:fixed;left:0;top:0;z-index:600;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.95;filter:drop-shadow(0 12px 24px rgba(0,0,0,.55))}
/* step guide */
.stepbar{display:flex;gap:5px}
.stp{flex:1;text-align:center;font-size:10px;font-family:var(--fd);padding:6px 2px;border-radius:9px;border:1px solid var(--line);color:var(--dim2)}
.stp.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
/* ===================== king ===================== */
.king{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#1b2233,#0b0f18);border:1px solid var(--line);box-shadow:var(--sh)}
html[data-gm="huaxu"] .king{background:linear-gradient(180deg,#efe4d2,#f8f4ec)}
html[data-gm="light"] .king{background:linear-gradient(180deg,#eef2f9,#fff)}
.king .kart{display:block;width:100%;height:92px}
.king .kname{font-family:var(--fd);font-size:12px;font-weight:600;padding:6px 9px 0;letter-spacing:.05em}
.king .kab{font-size:10px;color:var(--dim);padding:2px 9px 8px;line-height:1.5}
.king .khp{padding:0 9px 9px}
.kpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.kpick::-webkit-scrollbar{display:none}
.kpick .king{width:122px;flex:none;scroll-snap-align:start;transition:transform .14s}
.kpick .king.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--accSoft),0 0 16px var(--accSoft);transform:translateY(-3px)}
.kpick .king.sel::after{content:"選択中";position:absolute;top:0;right:0;background:var(--acc);color:#20160a;font-size:9px;padding:2px 7px;border-bottom-left-radius:8px;font-weight:600}
.kmini{display:flex;gap:10px;align-items:center}
.kmini .kart2{width:92px;flex:none}
.kmini .kt{flex:1;min-width:0}
.kmini .kn{font-family:var(--fd);font-size:13px;font-weight:600}
.kmini .ks{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:2px}
.hpbar{height:9px;border-radius:5px;background:rgba(0,0,0,.42);overflow:hidden;border:1px solid var(--line2);position:relative}
html[data-gm="huaxu"] .hpbar,html[data-gm="light"] .hpbar{background:rgba(0,0,0,.1)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),#e8836f);transition:width .4s}
.hpbar.e i{background:linear-gradient(90deg,#8c3b6e,#c96ba0)}
.hpnum{font-size:10px;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between}
/* ===================== shop ===================== */
.shoplv{display:flex;align-items:center;gap:9px}
.lvdots{display:flex;gap:3px;flex:1}
.lvdots i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.lvdots i.on{background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 7px var(--accSoft)}
/* ===================== battle ===================== */
#battle{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top)}
#battle.on{display:flex}
html[data-gm="ice"] #battle{background:var(--bg)}
#battle .bgl{position:absolute;inset:0;z-index:0;background:var(--scr);display:none}
html[data-gm="ice"] #battle .bgl,html[data-gm="huaxu"] #battle .bgl{display:block;background:var(--bg)}
#battle .bwrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:8px 11px calc(8px + env(safe-area-inset-bottom))}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bhead .vs{flex:none;font-family:var(--fn);font-size:11px;letter-spacing:.06em;color:var(--dim)}
.bhead .ttl{font-family:var(--fd);font-size:12.5px;font-weight:600;letter-spacing:.05em;flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bside{border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:7px 8px;backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s}
.bside.act{border-color:var(--acc);box-shadow:0 0 0 1px var(--accSoft),0 0 18px var(--accSoft)}
.bside .bl{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.05em}
.bside .bl b{font-family:var(--fd);font-size:11px;color:var(--txt);font-weight:600}
.bcenter{display:flex;align-items:center;justify-content:center;gap:9px;padding:6px 0}
.bcenter .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.bcenter .t{font-family:var(--fn);font-size:11.5px;letter-spacing:.2em;color:var(--acc)}
.log{flex:1;min-height:74px;overflow-y:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:7px 9px;font-size:11px;line-height:1.65;margin-top:6px}
.log div{opacity:0;animation:fin .3s forwards}
@keyframes fin{to{opacity:1}}
.log .l-turn{color:var(--acc);font-family:var(--fd);letter-spacing:.05em;margin-top:3px}
.log .l-dmg{color:#ffb4a8}
.log .l-ab{color:#ffe9a9}
.log .l-die{color:#ff9f9f;font-weight:600}
.log .l-sys{color:var(--dim)}
.bctl{display:flex;gap:8px;margin-top:8px}
.spd{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:none}
.spd button{padding:9px 10px;font-size:11.5px;color:var(--dim);font-family:var(--fn)}
.spd button.on{background:var(--accSoft);color:var(--acc)}
.u.lunge-m{transform:translateY(-30px) scale(1.08);box-shadow:0 0 0 2px var(--acc),0 12px 26px rgba(0,0,0,.5);z-index:5}
.u.lunge-e{transform:translateY(30px) scale(1.08);box-shadow:0 0 0 2px var(--red),0 12px 26px rgba(0,0,0,.5);z-index:5}
.u.hit{animation:uhit .32s}
@keyframes uhit{0%,100%{transform:translateX(0)}18%{transform:translateX(-5px)}42%{transform:translateX(5px)}66%{transform:translateX(-3px)}}
.u.dead{animation:udead .42s forwards}
@keyframes udead{to{opacity:0;transform:scale(.6) rotate(-10deg);filter:grayscale(1)}}
.u.tgt{box-shadow:0 0 0 2px var(--red),0 0 14px rgba(226,87,76,.5)}
.dmgpop{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);z-index:9;font-family:var(--fn);font-size:15px;font-weight:700;color:#ffd0c8;text-shadow:0 2px 6px #000,0 0 12px rgba(255,80,60,.8);pointer-events:none;animation:dmgup .78s forwards}
@keyframes dmgup{0%{opacity:0;transform:translate(-50%,-10%) scale(.7)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.abpop{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:9;font-family:var(--fd);font-size:10px;color:#ffe9a8;background:rgba(0,0,0,.72);padding:2px 6px;border-radius:6px;border:1px solid rgba(255,233,168,.4);white-space:nowrap;pointer-events:none;animation:abup 1.05s forwards}
@keyframes abup{0%{opacity:0;transform:translate(-50%,20%) scale(.8)}22%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.result{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,6,10,.78);backdrop-filter:blur(6px);padding:22px}
.result.on{display:flex}
.result .box{width:100%;max-width:340px;max-height:82vh;overflow-y:auto;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:var(--sh);animation:pop2 .45s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop2{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
.result .rt{font-family:var(--fd);font-size:25px;font-weight:600;letter-spacing:.1em;margin-bottom:4px}
.result .rs{font-size:12px;color:var(--dim);margin-bottom:12px}
.result.win .rt{color:var(--acc);text-shadow:0 0 22px var(--accSoft)}
.result.lose .rt{color:var(--red)}
/* ===================== codex / records ===================== */
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:7px 12px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;font-family:var(--fd);letter-spacing:.04em}
.tabs button.on{background:var(--accSoft);color:var(--acc);border-color:var(--acc)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.grid-cards .hcard{width:100%;height:auto;aspect-ratio:88/126}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.stat .k{font-size:10.5px;color:var(--dim);letter-spacing:.05em}
.stat .v{font-family:var(--fn);font-size:19px;font-weight:600;margin-top:2px}
.stat .v small{font-family:var(--fs);font-size:10.5px;color:var(--dim);font-weight:400;margin-left:3px}
.rankbar{display:flex;align-items:center;gap:10px}
.rankbadge{width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--rb1),var(--rb2));color:#fff;flex:none;border:1px solid rgba(255,255,255,.28)}
.rankbadge .rn{font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:.05em}
.rankbadge .ri{font-size:9px;opacity:.85;font-family:var(--fn)}
.rankinfo{flex:1;min-width:0}
.rankinfo .rl{font-family:var(--fd);font-size:15px;font-weight:600}
.rankinfo .rs{font-size:11px;color:var(--dim)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:7px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s}
.list{display:flex;flex-direction:column;gap:1px}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line2);font-size:12.5px}
.li:last-child{border-bottom:0}
.li .k{color:var(--dim);flex:1}
.li .v{font-family:var(--fn);font-weight:600}
.tour{display:flex;flex-direction:column;gap:6px}
.tline{display:flex;align-items:center;gap:8px;font-size:11.5px}
.tline .pos{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-size:10.5px;background:var(--panel3);color:var(--dim);flex:none}
.tline.me .pos{background:var(--acc);color:#20160a}
.tline.out{opacity:.42;text-decoration:line-through}
.tline .nm{flex:1;font-family:var(--fd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline .hb{width:62px;flex:none}
.tline .hb .hpbar{height:6px}
.tline .tg{font-size:9.5px;color:var(--dim);width:42px;text-align:right;flex:none}
.fxlist{display:flex;flex-direction:column;gap:1px}
.fxrow{display:flex;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line2);font-size:11.5px}
.fxrow:last-child{border-bottom:0}
.fxrow .fn2{font-family:var(--fd);font-weight:600;color:var(--acc);width:78px;flex:none}
.fxrow .fd2{color:var(--dim);flex:1;line-height:1.55}
#modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:rgba(3,5,9,.72);backdrop-filter:blur(5px);padding:20px}
#modal.on{display:flex}
#modal .mbox{width:100%;max-width:340px;max-height:80vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);animation:pop2 .3s}
#modal h3{font-size:15px;margin-bottom:8px}
#modal .mbody{font-size:12.5px;color:var(--dim);line-height:1.7}
#modal .macts{display:flex;gap:8px;margin-top:13px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(12px);z-index:200;background:var(--panel2);border:1px solid var(--acc);color:var(--txt);padding:9px 15px;border-radius:999px;font-size:12.5px;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.24s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.design-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.design-card{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.design-card.on{border-color:var(--acc)}
.design-card .sw{height:44px}
.design-card .lb{font-size:9.5px;text-align:center;padding:4px 2px;color:var(--dim);font-family:var(--fd)}
.design-card.on .lb{color:var(--acc)}
/* ===================== 起動演出 (splash) ===================== */
#splash{position:fixed;inset:0;z-index:500;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .55s ease,visibility .55s ease}
#splash.off{opacity:0;visibility:hidden}
#splash .splinebox{position:absolute;inset:-9% -3%;pointer-events:none}
#splash .arc{position:absolute;left:50%;top:50%;border-radius:50%;box-sizing:border-box;
  transform:translate(-50%,-50%);opacity:0;will-change:transform,opacity}
#splash .a3{box-shadow:0 0 9px rgba(226,64,47,.40);width:216px;height:100%;border:2px solid rgba(226,64,47,0);
  border-left-color:rgba(226,64,47,.72);border-right-color:rgba(232,58,42,1);
  animation:qC 1.30s 0s cubic-bezier(.35,0,.55,1) both,fadeOut .75s 1.42s ease both}
#splash .a1{box-shadow:0 0 7px rgba(255,255,255,.30);width:128px;height:100%;border:2px solid rgba(255,255,255,.94);
  animation:qA 1.30s .05s cubic-bezier(.35,0,.55,1) both,fadeOut .75s 1.42s ease both}
#splash .a2{box-shadow:0 0 6px rgba(255,255,255,.20);width:66px;height:100%;border:2px solid rgba(255,255,255,.66);
  animation:qB 1.30s .10s cubic-bezier(.35,0,.55,1) both,fadeOut .75s 1.42s ease both}
@keyframes qA{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.12)}
 30%{opacity:1;transform:translate(-50%,-50%) scaleX(1.05)}
 46%{transform:translate(-50%,-50%) scaleX(.95) translateX(-3px)}
 60%{transform:translate(-50%,-50%) scaleX(1.02) translateX(3px)}
 76%{transform:translate(-50%,-50%) scaleX(.985) translateX(-1.5px)}
 100%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}}
@keyframes qB{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.10)}
 26%{opacity:1;transform:translate(-50%,-50%) scaleX(1.10)}
 44%{transform:translate(-50%,-50%) scaleX(.90) translateX(4px)}
 62%{transform:translate(-50%,-50%) scaleX(1.04) translateX(-4px)}
 80%{transform:translate(-50%,-50%) scaleX(.97)}

function fxShort(fx){

  return out.join('・');
}

/* ---------------- study → 金貨 ---------------- */
function readStudy(){
  try{
    const raw=localStorage.getItem(STUDY_KEY);
    if(!raw) return null;
    const st=JSON.parse(raw);
    if(!st||typeof st!=='object') return null;
    const acts={};
    (st.activities||[]).forEach(a=>{ if(a&&a.id!=null) acts[a.id]=a; });
    const d0=new Date(); d0.setHours(0,0,0,0);
    const dayS=d0.getTime(), dayE=dayS+24*3600*1000;
    let ms=0, msToday=0;
    (st.sessions||[]).forEach(s=>{
      if(!s) return;
      const a=acts[s.activityId];
      if(!a||!a.isStudy||a.isSleep) return;
      const e=Number(s.end)||Date.now(), b=Number(s.start)||0;
      let d=e-b;
      if(!(d>0)) return;
      if(d>24*3600*1000) d=24*3600*1000;
      ms+=d;
      const ov=Math.min(e,dayE)-Math.max(b,dayS);
      if(ov>0) msToday+=Math.min(ov,d);
    });
    let streak=0;
    const sk=st.streak;
    if(typeof sk==='number') streak=sk;
    else if(sk&&typeof sk==='object') streak=Number(sk.count||sk.days||sk.current||sk.n||0)||0;
    return {min:ms/60000, minToday:msToday/60000, streak, design:(typeof st.design==='string'?st.design:null)};
  }catch(e){ return null; }
}
function multOf(streak){
  if(streak>=30) return 1.3;
  if(streak>=14) return 1.2;
  if(streak>=7)  return 1.15;
  if(streak>=3)  return 1.05;
  return 1;
}

  const top=cands.filter(c=>c.st===Math.max.apply(null,cands.map(x=>x.st)));
  const hi=cands.filter(c=>c.st>=maxStar-1);

  return pick(pool).id;
}

function recruitGain(c,slot){
  /* 募集終了時：フィールドの将札に永続強化を適用し、得た金貨を返す */
  let coin=0;
  const t=S.tour;
  (c.fx||[]).forEach(f=>{
    if(f.t!=='recruit') return;
    const fd=(f._fd||0);
    const focus=f.focus?(c.turns>=Math.max(0,f.focus-fd)):false;
    const a=focus?(f.a2||f.a):f.a, h=focus?(f.h2||f.h):f.h;
    if(focus) hookFocusUsed(t,c);
    let times=1;
    if(f.stackPer==='linkUsed') times=1+(t.linkUsedThisTurn?1:0);
    else if(f.stackPer==='focusHolders') times=Math.max(1,t.field.filter(x=>x&&(x.fx||[]).some(g=>(g.t==='recruit'&&g.focus)||g.t==='focus')).length);
    else if(f.stackPer==='recruitHolders') times=Math.max(1,t.field.filter(x=>x&&(x.fx||[]).some(g=>g.t==='recruit'||g.t==='focus')).length);
    else if(f.stackPer==='sysCount') times=Math.max(1,t.field.filter(x=>x&&sysOf(x)===f.sys).length);
    for(let k=0;k<times;k++){
      if(f.spendAll){
        const left=coins();
        if(left>0){ spendCoins(left); buffCards(t,t.field.filter(x=>x&&sysOf(x)===f.spendAll),left,left); toast(c.name+' の募集終了時：全金貨 '+left+' を消費して味方強化'); }
      }
      if(f.a||f.h){
        if(f.sys){ buffCards(t,t.field.filter(x=>x&&(!f.skipSelf||x!==c)&&sysOf(x)===f.sys),a||0,h||0); }
        else { c.atk+=(a||0); c.hp+=(h||0); }
      }
      if(f.coin) coin+=f.coin;
      if(f.addLink){ const lp=POOL.filter(x=>(x.fx||[]).some(g=>g.t==='link')); if(lp.length){ t.hand.push(newCard(pick(lp).id,false)); toast(c.name+' の募集終了時：連携の将札を1枚獲得'); } }
      if(f.addSys){ for(let m2=0;m2<(f.cnt||1);m2++){ const lp=POOL.filter(x=>x.s===f.addSys&&x.st<=t.shopLv); if(lp.length) t.hand.push(newCard(pick(lp).id,false)); } toast(c.name+' の注力：将札を獲得'); }
      if(f.addToken){ t.hand.push({uid:uid(),id:'tk',token:true,name:f.addToken.tn,atk:f.addToken.a,hp:f.addToken.h,fx:cloneFx(f.addToken.fx),sys:sysOf(c)}); toast(c.name+' の募集終了時：「'+f.addToken.tn+'」を手札に加えた'); }
      if(f.kingDmg){ const me=myEnt(); me.hp-=f.kingDmg; t.lastSelfDmg=t.turn; selfDmgWatchFire(t); }
      if(f.nextCoin){ t.incomeNext=(t.incomeNext||0)+f.nextCoin; }
      if(f.eachSteal){ t.field.filter(x=>x&&sysOf(x)===f.eachSteal).forEach(x=>{ const g=stealShopStats(t); if(g){ x.atk+=g.a; x.hp+=g.h; } }); toast(c.name+' の募集終了時：味方全員が商店の攻/命を得た'); }
      if(f.fireNeighbors&&slot!=null){ [slot-1,slot+1].forEach(si=>{ const n2=t.field[si]; if(n2){ applyEnterShop(t,n2,si,true); toast(c.name+' の募集終了時：'+n2.name+' の入場を発動'); } }); }
      if(f.focusDown){ t.field.forEach(x=>{ if(!x) return; (x.fx||[]).forEach(g=>{ if(g.focus){ g._fd=(g._fd||0)+1; } }); if(c._fc>0){ c._fc--; focusActivate(t,c); } }); hookFocusDown(t,slot); }
    }
  });
  if(c._fc===undefined){ const fo=(c.fx||[]).find(f=>f.t==='focus'); if(fo) c._fc=fo.n; }
  if(c._fc>0){ c._fc--; focusActivate(t,c); }
  return coin;
}
function resolveTurn(myResult){
  const t=S.tour, me=myEnt();
  if(t) t.leftLast=coins();
  const pairs=makePairs();
  const report=[];
  pairs.forEach(p=>{
    const A=t.ents[p[0]], B=t.ents[p[1]];
    if(A.human||B.human){
      const foe=A.human?B:A, mine=A.human?A:B;
      if(myResult.win==='m'){
        const dmg=Math.max(1,myResult.leftStar+t.shopLv);
        foe.hp-=dmg; report.push({text:mine.name+' が '+foe.name+' の王札に '+dmg+' の打撃（星'+myResult.leftStar+'＋商店Lv'+t.shopLv+'）',me:true,dmg});
      }else if(myResult.win==='e'){
        const dmg=Math.max(1,myResult.rightStar+foe.shopLv);
        mine.hp-=dmg; report.push({text:foe.name+' が あなたの王札に '+dmg+' の打撃',me:true,dmg});
      }else{
        report.push({text:'引き分け — 双方の王札に打撃なし',me:true});
      }
    }else{
      const pa=entPower(A)+(rnd(5)-2), pb=entPower(B)+(rnd(5)-2);
      const W=pa>=pb?A:B, Lo=pa>=pb?B:A;
      const dmg=Math.max(1,starsOf(W.cards.map(id=>({id})))+W.shopLv);
      Lo.hp-=dmg;
      report.push({text:W.name+' → '+Lo.name+' の王札に '+dmg+' の打撃',me:false});
    }
  });
  t.ents.forEach(e=>{
    if(e.hp<=0&&!e.out){ e.out=true; e.golem=true; report.push({text:e.name+' の王札が砕けた — 脱落'+(e.human?'':'（桃木人形として残る）'),me:e.human}); }
  });
  /* 募集終了時：効果と俸禄 */
  let income=1+(t.incomeNext||0); t.incomeNext=0;
  const refR=t.field.some(c=>c&&(c.fx||[]).some(f=>f.t==='refire'&&f.what==='recruit'))?2:1;
  for(let rr=0;rr<refR;rr++) t.field.forEach(c=>{ if(!c) return; if(rr===0) c.turns=(c.turns||0)+1; income+=recruitGain(c,t.field.indexOf(c)); });
  t.income=income;
  addCoins(income);
  report.push({text:'募集終了時 — 俸禄と効果で 金貨+'+income,me:true});
  t.lastPairs=pairs.map(p=>p.slice());
  t.turn++;
  t.shopTurns++;
  if(t.linkUsedThisTurn) t.linkStreak=(t.linkStreak||0)+1; else t.linkStreak=0;
  t.linkUsedThisTurn=false;
  t.field.forEach(c=>{ if(c){ c._rr=0; c._sp=0; } });
  hookTurnStart();
  const left=aliveEnts();
  let done=null;
  if(me.out) done='lose';
  else if(left.length===1&&left[0].human) done='champ';
  else if(left.length===1) done='lose';
  const place=done==='champ'?1:(me.out?left.length+1:null);
  t.report=report; t.pairs=pairs;
  save();
  return {report,done,place,left,income};
}
function finishTournament(done,place){
  const me=myEnt();
  S.plays++;
  let delta=placeDelta(place), rew=placeReward(place);
  let prot=null;
  if(delta<0){
    if(S.score<1000) delta=0;
    else{
      const line=[].concat(SC_LINES).reverse().find(l=>S.score>=l);
      if(line&&S.score+delta<line){ prot=line; delta=line-S.score; }
    }
  }
  S.score=Math.max(0,S.score+delta);
  let daily=false;
  if(place<=4&&S.lastBonus!==today()){ S.lastBonus=today(); S.top4++; rew+=5; daily=true; }
  addCoins(rew);
  if(done==='champ'){ S.wins++; if(place<=(S.best||99)||!S.best) S.best=1; }
  if(!S.best||place<S.best) S.best=place;
  save();
  return {delta,rew,daily,place,done,prot};
}

/* ---------------- drag & drop ---------------- */
let DRAG=null;
function dzClear(){ document.querySelectorAll('[data-dz]').forEach(z=>z.classList.remove('hot')); }
function dzAt(x,y){
  const el=document.elementFromPoint(x,y);
  return el?el.closest('[data-dz]'):null;
}
function dragify(el,opt){
  opt=opt||{};
  el.style.touchAction=opt.axis==='x'?'pan-x':'none';
  el.addEventListener('pointerdown',function(ev){
    if(ev.button&&ev.button!==0) return;
    if(DRAG) return;
    const sx=ev.clientX, sy=ev.clientY;
    let mode='tap', ghost=null;
    const pid=ev.pointerId;
    try{ el.setPointerCapture(pid); }catch(e){}
    function move(e2){
      if(mode!=='tap') return;
      const dx=e2.clientX-sx, dy=e2.clientY-sy;
      if(Math.abs(dx)<9&&Math.abs(dy)<9) return;
      if(opt.axis==='x'&&Math.abs(dx)>Math.abs(dy)){ mode='scroll'; return; }
      if(opt.canDrag&&!opt.canDrag()){ mode='scroll'; return; }
      mode='drag';
      ghost=el.cloneNode(true);
      ghost.classList.add('dragghost');
      ghost.style.width=el.offsetWidth+'px';
      ghost.style.height=el.offsetHeight+'px';
      ghost.style.left=e2.clientX+'px';
      ghost.style.top=e2.clientY+'px';
      document.body.appendChild(ghost);
      el.classList.add('dragging');
      document.body.classList.add('dragging');
      DRAG=opt;
    }
    function hover(e2){
      if(!ghost) return;
      ghost.style.left=e2.clientX+'px';
      ghost.style.top=e2.clientY+'px';
      const z=dzAt(e2.clientX,e2.clientY);
      document.querySelectorAll('[data-dz]').forEach(x=>x.classList.toggle('hot',x===z));
    }
    function finish(e2){
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',finish);
      el.removeEventListener('pointercancel',finish);
      try{ el.releasePointerCapture(pid); }catch(e){}
      const wasDrag=(mode==='drag');
      if(ghost){ ghost.remove(); ghost=null; }
      el.classList.remove('dragging');
      document.body.classList.remove('dragging');
      dzClear();
      DRAG=null;
      if(wasDrag){
        const z=dzAt(e2.clientX,e2.clientY);
        if(z&&opt.onDrop) opt.onDrop(z); else if(opt.onMiss) opt.onMiss();
      }else if(mode==='tap'&&opt.onTap){ opt.onTap(); }
    }
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',finish);
    el.addEventListener('pointercancel',finish);
  });
}
function handleDrop(from,z){
  const t=S.tour; if(!t) return;
  const dz=z.dataset.dz, i=Number(z.dataset.i);
  if(from.kind==='hand'&&dz==='link'){
    const hc=t.hand[from.idx];
    if(hc&&!hc.treasure&&!hc.token&&(hc.fx||[]).some(f=>f.t==='link')&&t.field[i]){ linkTo(from.idx,i); return; }
    if(t.field[i]){ toast('連携を持つ将札だけが付着できる'); placeCard(from.idx,i); return; }
  }
  if(from.kind==='hand'&&dz==='slot'){
    const c=t.hand[from.idx];
    if(c&&!c.treasure&&(c.fx||[]).some(f=>f.t==='link')&&t.field[i]){
      modal('連携の付着','『'+c.name+'』を '+t.field[i].name+' に付着させますか？<br>付着すると攻/命と能力を対象に付与します。',[
        {label:'付着する',cls:'primary',fn:()=>linkTo(from.idx,i)},
        {label:'場に出す',fn:()=>placeCard(from.idx,i)},
        {label:'やめる',cls:'ghost'}]);
      return;
    }
    placeCard(from.idx,i); return;
  }
  if(from.kind==='hand'&&dz==='field'){ const f=t.field.indexOf(null); if(f>=0) placeCard(from.idx,f); else toast('場が一杯'); return; }
  if(from.kind==='hand'&&dz==='sell'){ sellHand(from.idx); return; }
  if(from.kind==='hand'&&dz==='hand'){ return; }
  if(from.kind==='field'&&dz==='slot'){ moveField(from.idx,i); return; }
  if(from.kind==='field'&&dz==='hand'){ toHand(from.idx); return; }
  if(from.kind==='field'&&dz==='sell'){ sellField(from.idx); return; }
  if(from.kind==='lineup'&&dz==='hand'){ buy(from.idx); return; }
  toast('そこには置けない');
}

/* ===== v3.08 追加：商店段階フック群 ===== */
function buffCards(t,list,a,h){
  list.forEach(c=>{ c.atk+=a||0; c.hp+=h||0; });
  if((a||0)>0&&list.length){
    t.field.forEach(x=>{ if(!x) return; (x.fx||[]).forEach(f=>{ if(f.t==='atkUpWatch'&&(!f.sys||list.some(b=>sysOf(b)===f.sys))&&(!f.skipSelf||list.indexOf(x)<0)){ x.hp+=f.h; } }); });
  }
}
function stealShopStats(t){
  const av=t.lineup.filter(it=>!it.sold); if(!av.length) return null;
  const it=pick(av); const b=BYID[it.id];
  return {a:Math.round(b.atk*(it.mult||1))+((it.bonus&&it.bonus.a)||0),h:Math.round(b.hp*(it.mult||1))+((it.bonus&&it.bonus.h)||0)};
}
function shopAuraOf(t){
  const r={all:{a:0,h:0},sy:{}};
  t.field.forEach(c=>{ if(!c) return; (c.fx||[]).forEach(f=>{ if(f.t==='aura'&&f.shop){ if(f.shop.sys){ const o=r.sy[f.shop.sys]||(r.sy[f.shop.sys]={a:0,h:0}); o.a+=f.shop.a; o.h+=f.shop.h; } else { r.all.a+=f.shop.a; r.all.h+=f.shop.h; } } }); });
  const sb2=t.shopBuffSys||{};
  for(const k2 in sb2){ const o=r.sy[k2]||(r.sy[k2]={a:0,h:0}); o.a+=sb2[k2].a; o.h+=sb2[k2].h; }
  return r;
}
function applyShopBonus(c,it){
  const t=S.tour; if(!t||!it) return;
  const au=shopAuraOf(t);
  c.atk+=(au.all.a||0); c.hp+=(au.all.h||0);
  const s2=au.sy[sysOf(c)]; if(s2){ c.atk+=s2.a; c.hp+=s2.h; }
  if(it.mult){ c.atk=Math.round(c.atk*it.mult); c.hp=Math.round(c.hp*it.mult); }
  if(it.bonus){ c.atk+=it.bonus.a; c.hp+=it.bonus.h; }
}
function shopCardOf(it){ const c=newCard(it.id,false); applyShopBonus(c,it); return c; }
function chooseModal(t,c,f){
  let sys=f.sys;
  if(!sys){ const cnt={}; t.field.forEach(x=>{ if(x) cnt[sysOf(x)]=(cnt[sysOf(x)]||0)+1; }); let best=null; for(const k in cnt){ if(!best||cnt[k]>cnt[best]) best=k; } sys=best||SYS_ORDER[0]; }
  const cands=POOL.filter(x=>x.s===sys&&x.st<=t.shopLv);
  const opts=[]; const p2=cands.slice();
  for(let i=0;i<3&&p2.length;i++){ const k2=rnd(p2.length); opts.push(p2[k2]); p2.splice(k2,1); }
  if(!opts.length){ toast('候補がない'); return; }
  const acts=opts.map(o=>({label:o.n+'（星'+o.st+'）',cls:'primary',fn:()=>{ t.hand.push(newCard(o.id,false)); if(f.kingCost){ const me2=myEnt(); me2.hp-=o.st; toast('王札の生命−'+o.st); } toast('将札選択：'+o.n+' を獲得'); mergeCheck(); save(); renderTop(); renderShop(); }}));
  acts.push({label:'やめる',cls:'ghost'});
  modal('将札選択','3枚の候補から1枚選んで手札に加える（星'+t.shopLv+'以下）。',acts);
}
function applyEnterShop(t,c,slot,silent){
  (c.fx||[]).forEach(f=>{
    if(f.t!=='enter') return;
    if(f.k==='self'){ c.atk+=f.a||0; c.hp+=f.h||0; toast('入場：'+c.name+' は ＋'+(f.a||0)+'/＋'+(f.h||0)); }
    else if(f.k==='sysAtk'){ const sy=sysOf(c); t.field.forEach(x=>{ if(x&&sysOf(x)===sy) x.atk+=f.v; }); toast('入場：'+SYS[sy].n+'札の攻撃＋'+f.v); }
    else if(f.k==='coin'){ addCoins(f.v); toast('入場：金貨＋'+f.v); }
    else if(f.k==='reroll0'){ t.freeReroll=1; toast('入場：次回商店更新は0金貨'); }
    else if(f.k==='buffAll'){ buffCards(t,t.field.filter(x=>x&&(!f.sys||sysOf(x)===f.sys)),f.a,f.h); toast('入場：味方は＋'+f.a+'/＋'+f.h); }
    else if(f.k==='buffRand'){ const cands=t.field.filter(x=>x&&(!f.skipSelf||x!==c)&&sysOf(x)===f.sys); if(cands.length){ const tgt=pick(cands); tgt.atk+=f.a; tgt.hp+=f.h; toast('入場：'+tgt.name+' は＋'+f.a+'/＋'+f.h); } }
    else if(f.k==='shopAll'){ t.lineup.forEach(it=>{ it.bonus=it.bonus||{a:0,h:0}; it.bonus.a+=f.a; it.bonus.h+=f.h; }); toast('入場：商店の将札は+'+f.a+'/+'+f.h); }
    else if(f.k==='stealShop'){ for(let k=0;k<f.n;k++){ const g=stealShopStats(t); if(g){ c.atk+=g.a; c.hp+=g.h; } } toast('入場：'+c.name+' は商店の将札の攻/命を得た'); }
    else if(f.k==='addTokenHand'){ t.hand.push({uid:uid(),id:'tk',token:true,name:f.tn,atk:f.a,hp:f.h,fx:cloneFx(f.fx||[]),sys:sysOf(c)}); toast('入場：「'+f.tn+'」を手札に加えた'); }
    else if(f.k==='addLinkLast'){ if(t.lastLinkId){ t.hand.push(newCard(t.lastLinkId,false)); toast('入場：連携の将札を1枚獲得'); } else toast('入場：まだ使用した連携がない'); }
    else if(f.k==='addLink'){ const lp=POOL.filter(x=>(x.fx||[]).some(g=>g.t==='link')); if(lp.length){ t.hand.push(newCard(pick(lp).id,false)); toast('入場：連携の将札を1枚獲得'); } }
    else if(f.k==='copyPrev'){ if(t.prevFoe&&t.prevFoe.length){ t.hand.push(newCard(pick(t.prevFoe),false)); toast('入場：前の相手の将札を1枚獲得'); } else toast('入場：前の相手の記録がない'); }
    else if(f.k==='rerollX3'){ t.lineup=rollLineup(t.shopLv); t.lineup.forEach(it=>{ it.mult=3; }); toast('入場：商店を更新、将札は3倍の攻/命'); }
    else if(f.k==='choose'){ chooseModal(t,c,f); }
  });
}
function playedWatchFire(t,c){
  const sy=sysOf(c), hasLink=(c.fx||[]).some(f=>f.t==='link');
  t.field.forEach(x=>{
    if(!x||x===c) return;
    (x.fx||[]).forEach(f=>{
      if(f.t==='playedWatch'&&f.sys===sy){
        if(f.self){ x.atk+=f.self.a; x.hp+=f.self.h; toast(x.name+'：＋'+f.self.a+'/＋'+f.self.h); }
        if(f.all){ buffCards(t,t.field.filter(y=>y),f.all.a,f.all.h); }
        if(f.rand){ const cands=t.field.filter(y=>y&&sysOf(y)===f.sys); if(cands.length){ const tgt=pick(cands); tgt.atk+=f.rand.a; tgt.hp+=f.rand.h; toast(x.name+'：'+tgt.name+' は＋'+f.rand.a+'/＋'+f.rand.h); } }
        if(f.selfShop){ const g=stealShopStats(t); if(g){ x.atk+=g.a; x.hp+=g.h; toast(x.name+'：商店の将札の攻/命を得た'); } }
        if(f.reroll0){ t.freeReroll=1; toast(x.name+'：次回商店更新は0金貨'); }
        if(f.kingDmg){ const me=myEnt(); me.hp-=f.kingDmg; t.lastSelfDmg=t.turn; selfDmgWatchFire(t); }
      }
      if(f.t==='linkPlayed'&&hasLink){ t.linkPlayN=(t.linkPlayN||0)+1; const g=t.linkPlayN>=2?{a:f.a2,h:f.h2}:{a:f.a,h:f.h}; x.atk+=g.a; x.hp+=g.h; toast(x.name+'：連携使用で＋'+g.a+'/＋'+g.h); }
    });
  });
}
function enterWatchFire(t,c){
  t.field.forEach(x=>{ if(!x||x===c) return; (x.fx||[]).forEach(f=>{ if(f.t==='enterWatch'){ if(f.sys){ buffCards(t,t.field.filter(y=>y&&sysOf(y)===f.sys),f.a,f.h); } else { x.atk+=f.a; x.hp+=f.h; } } }); });
}
function selfDmgWatchFire(t){
  t.field.forEach(x=>{ if(!x) return; (x.fx||[]).forEach(f=>{ if(f.t==='selfDmgWatch'){ t._sdw=(t._sdw||0)+1; const use2=(f.from&&t._sdw>=f.from); const a=use2?(f.a2||f.a):f.a, h=use2?(f.h2||f.h):f.h; if(f.sys){ buffCards(t,t.field.filter(y=>y&&sysOf(y)===f.sys),a,h); } else { x.atk+=a; x.hp+=h; } } }); });
}
function hookTurnStart(){
  const t=S.tour; if(!t) return;
  t.field.forEach(c=>{
    if(!c) return;
    (c.fx||[]).forEach(f=>{
      if(f.t==='turnStart'&&f.coin){ addCoins(f.coin); toast(c.name+' のターン開始時：金貨＋'+f.coin); }
      if(f.t==='leftover'){ if(t.leftLast>0){ addCoins(t.leftLast); toast(c.name+' の募集開始時：前ターンの残り金貨＋'+t.leftLast); } }
      if(f.t==='linkStreak'){ if((t.linkStreak||0)>0){ c.atk+=f.v; c.hp+=f.v; toast(c.name+'：連携連続'+t.linkStreak+'ターンで＋'+f.v+'/＋'+f.v); } }
      if(f.t==='rerollGift'){ if(t._rg!==t.turn){ t._rg=t.turn; t.freeReroll=Math.min(f.n,(t.freeReroll||0)+1); toast(c.name+'：無料の商店更新を準備した'); } }
    });
  });
}
function hookReroll(){
  const t=S.tour; if(!t) return;
  t.field.forEach(c=>{
    if(!c) return;
    (c.fx||[]).forEach(f=>{
      if(f.t==='rerollWatch'){
        c._rr=(c._rr||0)+1;
        if(f.per&&f.coin){ if(c._rr%f.per===0){ addCoins(1); toast(c.name+'：商店'+f.per+'回更新で金貨＋1'); } }
        else if(f.sys){ const use2=(f.per&&c._rr>=f.per); buffCards(t,t.field.filter(y=>y&&sysOf(y)===f.sys),use2?(f.a2||f.a):f.a,use2?(f.h2||f.h):f.h); }
        else { c.atk+=f.a||0; c.hp+=f.h||0; }
      }
    });
  });
}
function hookSpend(n){
  const t=S.tour; if(!t||!n) return;
  t.field.forEach(c=>{
    if(!c) return;
    (c.fx||[]).forEach(f=>{
      if(f.t==='spendWatch'){
        if(f.atkSpent){ const cands=t.field.filter(y=>y&&sysOf(y)===f.sys); if(cands.length){ const tgt=pick(cands); tgt.atk+=n; toast(c.name+'：'+tgt.name+' の攻撃＋'+n); } }
        if(f.per){ c._sp=(c._sp||0)+n; while(c._sp>=f.per){ c._sp-=f.per; addCoins(1); toast(c.name+'：金貨を'+f.per+'消費で金貨＋1'); } }
      }
    });
  });
}
function hookGain(n){

    if(!c) return;
    (c.fx||[]).forEach(f=>{ if(f.t==='gainWatch'){ buffCards(t,t.field.filter(y=>y&&sysOf(y)===f.sys),f.a,f.h); } });

}
function hookSold(t,c){

    if(f.t==='soldAdd'){ t.hand.push({uid:uid(),id:'tk',token:true,name:f.tn,atk:f.a,hp:f.h,fx:[],sys:sysOf(c)}); toast(c.name+' の販売後：「'+f.tn+'」を手札に加えた'); }

function focusActivate(t,c){

function hookFocusDown(t,slot){

function hookFocusUsed(t,src){

function placeCard(hi,slot){

  const c=t.hand[hi]; if(!c) return;

  t.field[slot]=c;
  if(!c.token&&(c.fx||[]).some(f=>f.t==='link')) t.lastLinkId=c.id;

function linkTo(hi,slot){
  const t=S.tour, c=t.hand[hi], tgt=t.field[slot];
  if(!c||!tgt){ toast('付着できない'); return; }
  if(c.treasure||c.token||!(c.fx||[]).some(f=>f.t==='link')){ toast('連携を持つ将札だけが付着できる'); return; }

function moveField(a,b){

function sellField(i){

function mergeCheck(){
  const t=S.tour;
  const cnt={};
  t.hand.forEach(c=>{ if(c&&!c.treasure&&!c.gold&&!c.token) cnt[c.id]=(cnt[c.id]||0)+1; });
  let merged=null;
  for(const id in cnt){
    if(cnt[id]>=3){
      const rm=[];
      for(let i=0;i<t.hand.length&&rm.length<3;i++){ const c=t.hand[i]; if(c&&c.id===id&&!c.gold&&!c.treasure) rm.push(c); }
      rm.forEach(c=>{ const k=t.hand.indexOf(c); if(k>=0) t.hand.splice(k,1); });
      t.hand.push(newCard(id,true));
      t.hand.push({uid:uid(),treasure:true,id:null});
      S.golds[id]=true;
      merged=BYID[id].n;
    }
  }
  if(!merged){
    const mk=t.hand.find(c=>c&&!c.treasure&&!c.gold&&(c.fx||[]).some(f=>f.t==='mergeSys'));
    if(mk){
      const ms=(mk.fx.find(f=>f.t==='mergeSys')).sys;
      const mates=t.hand.filter(c=>c&&c!==mk&&!c.treasure&&!c.gold&&!c.token&&cdef(c.id).s===ms);
      if(mates.length>=2){
        const rm=[mk,mates[0],mates[1]];
        rm.forEach(c=>{ const k=t.hand.indexOf(c); if(k>=0) t.hand.splice(k,1); });
        t.hand.push(newCard(mk.id,true));
        t.hand.push({uid:uid(),treasure:true,id:null});
        S.golds[mk.id]=true;
        merged=BYID[mk.id].n;
        toast('統合：'+ms+' 2枚と合わせて黄金化');
      }
    }
  }
  if(merged){ toast('黄金将札「'+merged+'」誕生 — 宝札を獲得'); buzz(28); }
}

let B=null, BT=null, SPD=2;
function toBattle(){
  const t=S.tour;
  if(!t||t.finished) return;
  if(!myField().length){
    modal('将札が場に無い','将札を場に置かないと王札が無防備になり、無条件で敗北する。このまま対局するか？',[

function rowInit(row){
  row.innerHTML='';
  for(let i=0;i<FIELD_MAX;i++){
    const c=document.createElement('div');
    c.className='ucell'; c.dataset.key='-';
    c.innerHTML='<div class="slot"></div>';
    row.appendChild(c);
  }
}
function drawBattle(snapM,snapE){
  [['eRow',snapE],['mRow',snapM]].forEach(function(p){
    const row=$(p[0]), list=p[1]; if(!row||!list) return;
    for(let i=0;i<FIELD_MAX;i++){
      const cell=row.children[i]; if(!cell) continue;
      const u=list[i], key=u?u.uid:'-';
      if(cell.dataset.key!==key){
        cell.dataset.key=key;
        cell.innerHTML=u?unitHTML(u):'<div class="slot">退場</div>';
      }else if(u){
        const el=cell.firstChild;
        if(el&&el.classList){
          const bar=el.querySelector('.hp i'); if(bar) bar.style.width=Math.max(0,Math.round(u.cur/u.max*100))+'%';
          const v=el.querySelector('.uval'); if(v) v.textContent=Math.max(0,u.cur);
        }
      }
    }
  });
}
function uEl(uid){ return document.querySelector('#battle [data-uid="'+uid+'"]'); }
function lunge(ev){
  const a=uEl(ev.uid), t=uEl(ev.tn);
  if(a){ a.classList.add(ev.side==='m'?'lunge-m':'lunge-e'); setTimeout(()=>{ if(a) a.classList.remove('lunge-m','lunge-e'); },300/SPD); }
  if(t) t.classList.add('tgt');
  const side=ev.side==='m'?'mSide':'eSide';
  const s=$(side); if(s){ s.classList.add('act'); setTimeout(()=>s.classList.remove('act'),400/SPD); }
}
function hitFx(ev){
  const el=uEl(ev.uid); if(!el) return;
  el.classList.add('hit'); setTimeout(()=>{ if(el) el.classList.remove('hit'); },360/SPD);
  const s=document.createElement('div'); s.className='dmgpop'; s.textContent='-'+ev.amount;
  el.appendChild(s); setTimeout(()=>{ if(s.parentNode) s.remove(); },820/SPD);
  const bar=el.querySelector('.hp i'); if(bar) bar.style.width=ev.pct+'%';
  const v=el.querySelector('.uval'); if(v) v.textContent=ev.cur;
  document.querySelectorAll('#battle .tgt').forEach(x=>{ if(x!==el) x.classList.remove('tgt'); });
}
function dieFx(ev){
  const el=uEl(ev.uid); if(!el) return;
  el.classList.remove('hit','tgt');
  el.classList.add('dead');
}
function abilityFx(ev){
  const el=uEl(ev.uid); if(!el) return;
  const s=document.createElement('div'); s.className='abpop'; s.textContent=ev.text;
  el.appendChild(s); setTimeout(()=>{ if(s.parentNode) s.remove(); },1100/SPD);
}
function logLine(ev){
  const box=$('bLog'); if(!box) return;
  const d=document.createElement('div');
  d.className=ev.cls||''; d.textContent=ev.text;
  box.appendChild(d); box.scrollTop=box.scrollHeight;

}
function doBattle(){
  const t=S.tour, me=myEnt();
  const foe=foeOf(me)||aliveEnts().find(e=>!e.human);
  if(!foe){ toast('対戦相手がいない'); return; }
  const res=simBattle(t.field,enemyField(foe),KINGBY[t.kingId],KINGBY[foe.kingId],t.shopLv);
  B={res,me,foe,idx:0,done:false};
  $('bTitle').textContent='第'+t.turn+'ターン 対局';
  $('eName').textContent=foe.name+'（'+KINGBY[foe.kingId].n+'）';
  $('mName').textContent='あなた（'+KINGBY[t.kingId].n+'）';
  $('bRound').textContent='第1局';
  $('mKingHp').textContent='王札 '+Math.max(0,me.hp)+'/'+me.max;
  $('bLog').innerHTML='';
  $('bResult').classList.remove('on','win','lose');
  rowInit($('eRow')); rowInit($('mRow'));
  $('battle').classList.add('on');
  playEvents();

function playEvents(){
  if(BT) clearTimeout(BT);
  step();
}
function step(){
  if(!B){ return; }
  const E=B.res.E;
  if(B.idx>=E.length){ finishBattle(); return; }
  const ev=E[B.idx++];
  let d=40;
  if(ev.t==='state'){ drawBattle(ev.m,ev.e); d=0; }
  else if(ev.t==='log'){ logLine(ev); d=0; }
  else if(ev.t==='round'){ $('bRound').textContent='第'+ev.n+'局'; d=200; }
  else if(ev.t==='act'){ lunge(ev); d=175; }
  else if(ev.t==='dmg'){ hitFx(ev); d=115; }
  else if(ev.t==='ability'){ abilityFx(ev); d=160; }
  else if(ev.t==='die'){ dieFx(ev); d=330; }
  else if(ev.t==='end'){ d=60; }
  BT=setTimeout(step,Math.max(0,d/SPD));
}
function skipBattle(){
  if(BT){ clearTimeout(BT); BT=null; }
  if(!B) return;
  const E=B.res.E;
  while(B.idx<E.length){
    const ev=E[B.idx++];
    if(ev.t==='state') drawBattle(ev.m,ev.e);
    else if(ev.t==='log') logLine(ev);
  }
  finishBattle();
}
function finishBattle(){
  if(BT){ clearTimeout(BT); BT=null; }

  }
  $('bResultBox').innerHTML='<div class="rt">'+head+'</div><div class="rs">'+esc(sub)+'</div>'+lines+
    (r.done?'':'<div class="tip" style="text-align:left;margin-top:8px">残り '+r.left.length+' 名 — 商店へ戻って将札を強くせよ。</div>')+

  document.querySelectorAll('#dgrid .design-card').forEach(d=>d.onclick=()=>{
    S.design=d.dataset.d; S.designSet=true; save(); applyTheme(); renderRec(); renderTop();
  });
}
/* ---------------- nav / boot ---------------- */
function go(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  const el=$('s-'+s); if(el) el.classList.add('on');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===s));
  if(s==='home') renderHome();
  if(s==='shop') renderShop();
  if(s==='codex') renderCodex();
  if(s==='rec') renderRec();
  renderTop();
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));
document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{
  SPD=Number(b.dataset.v);
  document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b));
});
$('modal').onclick=e=>{ if(e.target===$('modal')) closeModal(); };
function boot(){
  load();
  syncDay();
  syncFromStudy();
  const st=studyInfo();
  if(st&&st.design){ const map={game:'kintan',dark:'dark',light:'light',auto:'light',ice:'ice',huaxu:'huaxu'}; if(map[st.design]&&!S.designSet) S.design=map[st.design]; }
  applyTheme();
  renderTop(); renderHome(); go('home');
  const sp=$('splash');
  if(sp){
    const off=()=>{ if(sp.classList.contains('off'))return; sp.classList.add('off'); setTimeout(()=>{ if(sp.parentNode) sp.remove(); },700); };
    sp.addEventListener('click',off); sp.addEventListener('touchstart',off,{passive:true});
    const _rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(off,_rm?1100:3600);
  }
}
function _showErr(m){
  try{ var d=document.createElement('pre');
    d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:999;background:#3a0d0d;color:#ffb3b3;font-size:10px;padding:8px;margin:0;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent='ERR: '+m; document.body.appendChild(d); }catch(e){}
}
window.addEventListener('error',function(ev){ _showErr(ev.message+' @'+ev.lineno); });
try{ boot(); }catch(e){ _showErr(e.message+' | '+(e.stack||'').split('\n')[1]); }
</script>
</body>
